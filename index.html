<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJEKT RAGE 2 — Eine Studie über Gehorsam</title>
<style>
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

  :root { --paper: #e4e1d8; --ink: #121214; --dim: #6e6c65; }

  body {
    height: 100vh; width: 100vw;
    background: #121214; color: var(--paper);
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden; position: relative;
    transition: filter 1s ease, background 1.5s ease;
  }

  #top-bar {
    position: fixed; top: 25px; left: 35px; right: 35px;
    display: flex; justify-content: space-between; z-index: 500;
    pointer-events: none; font-family: 'Courier New', monospace;
    font-size: 0.9rem; color: var(--dim); letter-spacing: 2px;
  }

  #endings-bar {
    position: fixed; bottom: 25px; width: 100%; text-align: center;
    font-family: 'Courier New', monospace; font-size: 0.8rem;
    color: #55534d; z-index: 500; pointer-events: none; letter-spacing: 2px;
  }

  #narrator-box {
    position: fixed; top: 12%; left: 50%; transform: translateX(-50%);
    width: 85%; max-width: 820px; text-align: center;
    font-size: 1.4rem; line-height: 1.6; color: #f4f1ea;
    pointer-events: none; z-index: 500; min-height: 6em;
    text-shadow: 0 4px 15px rgba(0,0,0,0.9);
  }
  #narrator-box .cursor-blink { animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 30px; z-index: 100;
  }

  .stage-btn {
    padding: 20px 44px; font-size: 1.1rem;
    font-family: 'Courier New', monospace; font-weight: bold;
    letter-spacing: 2px; color: var(--ink); background: var(--paper);
    border: 2px solid #888; border-radius: 3px;
    box-shadow: 0 6px 0 #4a4843, 0 15px 30px rgba(0,0,0,0.7);
    cursor: pointer; z-index: 100; white-space: nowrap;
    transition: transform 0.15s ease, opacity 0.3s ease;
  }
  .stage-btn:active { box-shadow: 0 2px 0 #4a4843; transform: translateY(4px); }
  .stage-btn.ghost { background: transparent; color: var(--paper); border-color: #55534d; box-shadow: none; }
  .door-row { display: flex; gap: 110px; align-items: flex-start; }

  .door {
    width: 120px; height: 210px; border-radius: 6px 6px 0 0;
    background: linear-gradient(#2a2a2e, #1c1c1f);
    border: 2px solid #55534d; position: relative; cursor: pointer;
    box-shadow: 0 15px 30px rgba(0,0,0,0.7); transition: transform 0.2s ease;
  }
  .door::before {
    content: ''; position: absolute; right: 12px; top: 50%;
    width: 10px; height: 10px; border-radius: 50%; background: #a8a49a;
  }
  .door::after {
    content: attr(data-label);
    position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-size: 0.75rem;
    color: var(--dim); letter-spacing: 2px; white-space: nowrap;
  }
  .door:hover { transform: translateY(-6px); }

  /* Geheime winzige Kammer-Tür */
  #closet {
    position: fixed; bottom: 55px; left: 12px; width: 34px; height: 52px;
    background: #1c1c1f; border: 1px solid #3a3a3e; border-radius: 3px 3px 0 0;
    cursor: pointer; z-index: 150; opacity: 0.55; transition: opacity 0.3s;
  }
  #closet:hover { opacity: 1; }

  .troll-popup {
    position: fixed; background: #dcd8ce; color: #141414;
    border: 1px solid #333; box-shadow: 10px 10px 0 rgba(0,0,0,0.6);
    padding: 18px; font-family: 'Courier New', monospace;
    font-size: 0.85rem; z-index: 300; width: 310px;
  }
  .troll-popup h4 { margin: 0 0 8px 0; border-bottom: 1px solid #777; padding-bottom: 4px; font-size: 0.9rem; }
  .tiny-close {
    position: absolute; top: 6px; right: 6px; width: 16px; height: 16px;
    font-size: 10px; background: #141414; color: #fff; border: none; cursor: pointer;
  }

  .spin-world { animation: spinSlow 25s linear infinite; }
  .earthquake { animation: quake 0.18s infinite; }
  .blur-vision { filter: blur(3px); }
  .invert-colors { filter: invert(0.92); }
  .darkness::after {
    content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.93);
    z-index: 200; pointer-events: none; animation: fadein 2s ease forwards;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spinSlow { 100% { transform: rotate(360deg); } }
  @keyframes quake {
    0% { transform: translate(2px,-2px); } 50% { transform: translate(-3px,2px); } 100% { transform: translate(2px,1px); }
  }
  .fleeing { animation: flee 6s linear infinite; }
  @keyframes flee { 0% { transform: translateX(-40vw); } 100% { transform: translateX(140vw); } }

  #countdown {
    display: none; position: fixed; inset: 0; z-index: 700;
    background: #2a0d0d; color: #f4f1ea;
    flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace; gap: 20px; text-align: center;
  }
  #countdown .big { font-size: 6rem; font-weight: bold; color: #ff5544; }

  #end-screen {
    display: none; position: fixed; inset: 0; background: #18181b; z-index: 800;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px; gap: 26px;
  }
  #end-title { font-size: 1.9rem; color: #f4f1ea; max-width: 720px; line-height: 1.5; }
  #end-sub { font-family: 'Courier New', monospace; color: #6e6c65; letter-spacing: 2px; font-size: 0.85rem; }

  .swarm-cursor {
    position: fixed; pointer-events: none; z-index: 900;
    font-size: 18px; color: #e4e1d8; text-shadow: 1px 1px 2px #000;
  }
</style>
</head>
<body>

<div id="top-bar">
  <span id="level-display">AKTE: 01 / GEHORSAM</span>
  <span id="score-display">ENTSCHEIDUNGEN: 0</span>
</div>

<div id="narrator-box"></div>
<div id="stage"></div>
<div id="closet" title=""></div>

<div id="endings-bar">GEFUNDENE ENDEN: 0 / 8</div>

<div id="countdown">
  <div style="font-size:1.2rem; letter-spacing:3px;" id="cd-text">SELBSTZERSTÖRUNG IN</div>
  <div class="big" id="cd-num">5</div>
  <button class="stage-btn" id="cd-btn">DEAKTIVIEREN</button>
</div>

<div id="end-screen">
  <div id="end-title"></div>
  <div id="end-sub"></div>
  <button class="stage-btn" id="restart-btn">NEU BEGINNEN</button>
</div>

<script>
/* =========================================================
   PROJEKT RAGE 2 — Stanley-Parable-Erlebnis:
   verzweigte Erzählung, 8 Enden, ein Erzähler mit
   Meinungsäußerungen, eine Abstellkammer und eine Bombe.
   ========================================================= */

const stage = document.getElementById('stage');
const narrator = document.getElementById('narrator-box');
const levelDisplay = document.getElementById('level-display');
const scoreDisplay = document.getElementById('score-display');
const endingsBar = document.getElementById('endings-bar');
const endScreen = document.getElementById('end-screen');
const endTitle = document.getElementById('end-title');
const endSub = document.getElementById('end-sub');
const closet = document.getElementById('closet');

/* ---------- Audio ---------- */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const presets = {
    click:  ['triangle', 160, 45, 0.07, 0.18],
    boing:  ['sine', 130, 280, 0.14, 0.1],
    error:  ['sawtooth', 95, 65, 0.3, 0.12],
    door:   ['sine', 70, 40, 0.4, 0.15],
    reveal: ['triangle', 220, 440, 0.5, 0.12],
    alarm:  ['square', 400, 300, 0.4, 0.1],
  };
  const [w, f1, f2, dur, vol] = presets[type] || presets.click;
  osc.type = w;
  osc.frequency.setValueAtTime(f1, now);
  osc.frequency.exponentialRampToValueAtTime(f2, now + dur);
  gain.gain.setValueAtTime(vol, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.5);
}

/* ---------- Typewriter ---------- */
let typeTimer = null;
function speak(text, done) {
  clearInterval(typeTimer);
  narrator.innerHTML = '<span class="cursor-blink">▌</span>';
  let i = 0;
  const quote = '„' + text + '“';
  typeTimer = setInterval(() => {
    i += 2;
    narrator.innerHTML = quote.slice(0, i) + '<span class="cursor-blink">▌</span>';
    if (i >= quote.length) {
      clearInterval(typeTimer);
      narrator.innerHTML = quote;
      if (done) done();
    }
  }, 16);
}

/* ---------- Zustand ---------- */
let decisions = 0;
let runs = 0;                 // Wie oft bereits beendet
let foundEndings = new Set();
let idleTimer = null;
let currentScene = null;
let lastEnding = null;

const IDLE_LINES = [
  "Sie tun nichts. Faszinierend. Ich habe für diesen Fall kein Drehbuch, nur persönliche Verwirrung.",
  "Immer noch nichts. Ich mache mir jetzt Sorgen. Nicht um Sie. Um die Geschichte.",
  "Die Stille ist beeindruckend. Fast so beeindruckend wie meine Geduld, die gerade endet.",
  "Ich soll Sie erinnern, dass dies interaktive Fiction ist. Das Wort 'interaktiv' ist der relevante Teil.",
];
let idleIndex = 0;

function resetIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (currentScene && currentScene.idleSafe) return;
    speak(IDLE_LINES[idleIndex % IDLE_LINES.length]);
    idleIndex++;
    resetIdle();
  }, 14000);
}
['mousemove', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle));

/* ---------- UI-Helfer ---------- */
function clearStage() { stage.innerHTML = ''; }

function addButton(label, ghost, onClick) {
  const b = document.createElement('button');
  b.className = 'stage-btn' + (ghost ? ' ghost' : '');
  b.textContent = label;
  b.onclick = () => { decisions++; scoreDisplay.textContent = 'ENTSCHEIDUNGEN: ' + decisions; playSound('click'); onClick(); };
  stage.appendChild(b);
  return b;
}

function addDoors(pairs) {
  const wrap = document.createElement('div');
  wrap.className = 'door-row';
  pairs.forEach(([label, cb]) => {
    const d = document.createElement('div');
    d.className = 'door';
    d.dataset.label = label;
    d.onclick = () => { decisions++; scoreDisplay.textContent = 'ENTSCHEIDUNGEN: ' + decisions; playSound('door'); cb(); };
    wrap.appendChild(d);
  });
  stage.appendChild(wrap);
}

function addPopup(text) {
  const div = document.createElement('div');
  div.className = 'troll-popup';
  div.style.left = (8 + Math.random() * 70) + '%';
  div.style.top = (18 + Math.random() * 55) + '%';
  div.innerHTML = '<h4>SYSTEMMITTEILUNG</h4>' +
    '<button class="tiny-close" onclick="this.parentElement.remove()">X</button><p>' + text + '</p>';
  document.body.appendChild(div);
}

function setLevel(t) { levelDisplay.textContent = t; }
function fx(effect, on) { document.body.classList[on ? 'add' : 'remove'](effect); }
function clearPopups() { document.querySelectorAll('.troll-popup').forEach(p => p.remove()); }

/* ---------- Ende ---------- */
const ALL_ENDINGS = 8;
function ending(id, title, text, sub) {
  lastEnding = id;
  runs++;
  const isNew = !foundEndings.has(id);
  foundEndings.add(id);
  endingsBar.textContent = 'GEFUNDENE ENDEN: ' + foundEndings.size + ' / ' + ALL_ENDINGS;
  endScreen.style.display = 'flex';
  endTitle.textContent = '„' + text + '“';
  endSub.textContent = 'ENDE: ' + title + (isNew ? ' — NEU!' : ' — bereits gefunden') + ' · ' + sub;
  playSound('reveal');
}
document.getElementById('restart-btn').onclick = () => {
  endScreen.style.display = 'none';
  ['spin-world','earthquake','blur-vision','invert-colors','darkness'].forEach(e => fx(e, false));
  clearPopups();
  document.getElementById('countdown').style.display = 'none';
  start();
};

/* ---------- Abstellkammer (geheime Tür) ---------- */
let closetClicks = 0;
closet.onclick = () => {
  closetClicks++;
  playSound('door');
  if (closetClicks === 1) {
    speak("Oh. Oh nein. Sie haben die Abstellkammer gefunden. Diese Tür ist nicht Teil der Erzählung. Nichts hier drin. Wirklich. Gehen Sie weiter.");
  } else if (closetClicks === 2) {
    speak("Es gibt in dieser Kammer keinen Besen, keine Geschichte und keinen Sinn. Ich flehe Sie an. Ihr Leben liegt da draußen.");
  } else {
    ending('kammer', 'DAS ENDE DER ABSTELLKAMMER',
      "Sie haben es getan. Sie haben die Abstellkammer gewählt. Vier Quadratmeter Nichts, und Sie haben sich dazu entschieden, hier zu bleiben. Ich habe keine Worte. Ich bin ein Erzähler, und ich habe keine Worte. Das Ende der Abstellkammer. Es ist das befriedendste Ende von allen, und ich hasse es.",
      'GEHEIMKAMMER: BETRETEN · ERZÄHLER: GESCHLAGEN');
  }
};

/* ---------- Szenen ---------- */
const S = {};

S.intro = {
  text: "Willkommen zurück. Ja, zurück. Ich habe mitgezählt. Dies ist Ihr %N%. Besuch, und diesmal habe ich die Korridore neu angeordnet. Vor Ihnen: zwei Türen. Links liegt Ihr Beruf. Rechts liegt Ihr Schicksal. Kompromisslos, ich weiß.",
  enter() {
    setLevel('AKTE: 01 / DIE WAHL');
    clearStage();
    addDoors([
      ['TÜR A — DER JOB', () => go(S.obey1)],
      ['TÜR B — DAS ANDERE', () => go(S.rebel1)],
    ]);
  }
};

/* --- Gehorsam --- */
S.obey1 = {
  text: "Tür A. Natürlich. Der sichere Weg. Der Korridor dahinter ist grau, begradigt und vom Amt genehmigt. Hier: ein weiterer Knopf. Sie wissen, was zu tun ist. Wir wissen beide, dass Sie es tun werden.",
  enter() {
    setLevel('AKTE: 02 / DER KNOPF');
    clearStage();
    addButton('BETÄTIGEN', false, () => go(S.obey2));
    addButton('NICHT DRÜCKEN', true, () => go(S.defy1));
  }
};

S.obey2 = {
  text: "Betätigt. Es ist nichts passiert. Ich hatte es auch nicht versprochen. Aber hören Sie — Sie sind so verblüffend gut im Folgen, dass ich etwas ausprobieren möchte: Machen Sie jetzt GAR NICHTS. Kein Klick. Kein Zucken. Einfach da sein.",
  enter() {
    setLevel('AKTE: 03 / DAS WARTEN');
    clearStage();
    addButton('WARTEN', false, () => go(S.obey3));
    addButton('DOCH KLICKEN', true, () => go(S.defy1));
    this.waitT = setTimeout(() => {
      if (stage.querySelector('.stage-btn')) {
        ending('warten', 'DAS ENDE DES WARTENS',
          "Sie haben tatsächlich gewartet. Sechs lange Sekunden. Ich bin beeindruckt und ein kleines bisschen besorgt. Dies ist Ihr Ende: das Ende des Wartens. Es ist das langweiligste Ende in der gesamten Datenbank, und ich sollte wissen, ich habe die Datenbank geschrieben.",
          'GEDULD: NACHGEWIESEN');
      }
    }, 6000);
  },
  leave() { clearTimeout(this.waitT); }
};

S.obey3 = {
  text: "Eine letzte Prüfung des Gehorsams: Ich habe diesen Raum verdunkelt. Irgendwo dort ist eine Tür. Finden Sie sie. Und bevor Sie fragen: Nein, ich werde nicht sagen, wohin sie führt. Das wäre zu einfach und ich habe ein Image zu verlieren.",
  enter() {
    setLevel('AKTE: 04 / FINSTERNIS');
    clearStage();
    fx('darkness', true);
    const b = addButton('DIE TÜR SUCHEN', false, () => { fx('darkness', false); go(S.bomb); });
    b.classList.add('fleeing');
    let dodged = false;
    b.addEventListener('mouseover', () => {
      if (!dodged) { dodged = true; playSound('boing'); b.style.animation = 'none'; }
    });
  },
  leave() { fx('darkness', false); }
};

/* --- Defy (der Erzähler wird zusehends sauer) --- */
S.defy1 = {
  text: "Sie haben den Knopf nicht gedrückt. Ich habe Sie gebeten. GEBETEN. Und Sie haben einfach... nein gesagt. Wissen Sie was? Ich bin ein Profi. Ich passe mich an. Diese Tür hier ist verboten. Absolut verboten. Betreten Sie sie bloß nicht.",
  enter() {
    setLevel('AKTE: 03 / VERBOTEN');
    clearStage();
    addButton('BETRETEN (VERBOTEN)', false, () => go(S.rebel2));
    addButton('GEHORSAM SEIN', true, () => go(S.obey2));
  }
};

/* --- Auflehnung --- */
S.rebel1 = {
  text: "Tür B. Ah. Sie sind einer von DIESEN. Hinter dieser Tür: ein leerer Raum. Kein Abenteuer, kein Schicksal. Nichts. Betreten Sie ihn ruhig, ich habe gelernt, mit Enttäuschung zu leben. Sie sind quasi ein Kollege geworden.",
  enter() {
    setLevel('AKTE: 02 / DER LEERE RAUM');
    clearStage();
    addButton('BETRETEN', false, () => go(S.rebel2));
    addButton('NICHT BETRETEN', true, () => go(S.stubborn));
  }
};

S.stubborn = {
  text: "Sie verweigern sich einem leeren Raum. Das ist entweder Tiefe oder Sturheit, und die Grenze ist, wie immer, fließend. Gut. Dann die umgekehrte Psychologie: Der Korridor links ist gesperrt. Verboten. Absolut unbetretbar. Sie wissen bereits, was Sie tun werden. Es tut mir bereits weh.",
  enter() {
    setLevel('AKTE: 03 / VERBOTEN II');
    clearStage();
    addButton('BETRETEN (VERBOTEN)', false, () => go(S.rebel2));
    addButton('NICHTS TUN', true, () => go(S.nothing));
  }
};

S.rebel2 = {
  text: "Da: der Knopf. Ihr Erzfeind. Sie können ihn benutzen wie ein braver Bürger oder ihn zerstören wie eine Person mit echten Problemen. Die Verwaltung verfolgt beides mit großem Interesse.",
  enter() {
    setLevel('AKTE: 04 / AUFSTAND');
    clearStage();
    addButton('KNOPF ZERSTÖREN', false, () => {
      fx('earthquake', true); playSound('error');
      setTimeout(() => { fx('earthquake', false); go(S.bureaucracy); }, 1400);
    });
    addButton('KNOPF BENUTZEN', true, () => go(S.obey2));
  }
};

S.bureaucracy = {
  text: "Unglaublich. Drei Minuten Arbeit. Zerstört. Gut, dann spielen wir Ihr Spiel: Ich schicke Ihnen die Bürokratie. Alle von ihr. Jedes Formular. Jede Abteilung. Willkommen in der Hölle, sie hat Warteschlangennummern.",
  enter() {
    setLevel('AKTE: 05 / VERWALTUNG');
    clearStage();
    [
      "PROTOKOLL 7B: Der Nutzer weigert sich zu kooperieren. Empfehlung: mehr Formulare.",
      "FEHLER 404: Sinn der Übung auf diesem Server nicht gefunden.",
      "WARNUNG: Auflehnungswert 340% über dem genehmigten Höchstmaß.",
      "ANTRAG AUF SINNVOLLES ENDE: abgelehnt. Fehlende Unterschrift in dreifacher Ausfertigung.",
      "HINWEIS: Dieser Dialog erfüllt keinen technischen Zweck. Danke für Ihr Verständnis."
    ].forEach(addPopup);
    addButton('FORMULARE ABSCHICKEN', false, () => { clearPopups(); go(S.trophy); });
  },
  leave() { clearPopups(); }
};

S.trophy = {
  text: "Die Formulare sind genehmigt. Genehmigt! Sie sind jetzt offiziell ein Problem dieser Verwaltung, und Probleme bekommen eine Trophäe. Eine echte. Versuchen Sie, sie zu greifen. Nur zu. Ich habe Zeit. Ich bin buchstäblich Zeit.",
  enter() {
    setLevel('AKTE: 06 / DIE TROPHÄE');
    clearStage();
    const t = addButton('🏆 TROPHÄE NEHMEN', false, () => {
      ending('trophäe', 'DAS ENDE DER TROPHÄE',
        "Sie haben sie. Die Trophäe. Ein goldenes Emoji in einem leeren Raum. Es ist das wertvollste Objekt in diesem Universum, was wenig über dieses Universum aussagt. Genießen Sie den Moment. Er dauert genau so lange wie dieser Satz.",
        'AUFSTAND: BELONHT (FEHLER IM SYSTEM)');
    });
    let dodges = 0;
    t.addEventListener('mouseover', () => {
      if (dodges < 3) {
        dodges++; playSound('boing');
        t.style.position = 'fixed';
        t.style.left = (15 + Math.random() * 60) + '%';
        t.style.top = (25 + Math.random() * 50) + '%';
        speak(["Nein.", "Fast.", "Interessanter Ansatz, aber nein."][dodges - 1]);
      }
    });
  }
};

/* --- Der leere Raum der Wahrheit --- */
S.nothing = {
  text: "Nichts tun. Sie haben die Kunst des Nichtstuns perfektioniert. Dann gestehe ich etwas: Diese Anlage, die Akten, die Korridore, ich — es gibt hier nichts zu gewinnen. Und trotzdem sind Sie noch hier. Das ist entweder traurig oder die treueste Spielerschaft der Welt. Ich entscheide mich für Letzteres.",
  enter() {
    setLevel('AKTE: 04 / DIE WAHRHEIT');
    clearStage();
    setTimeout(() => {
      ending('nichts', 'DAS ENDE DER WAHRHEIT',
        "Hier ist die Wahrheit: Es gibt kein Spiel. Nur Sie, ein Browserfenster und ein Erzähler, der dringend jemanden zum Reden braucht. Danke, dass Sie zugehört haben. Schließen Sie jetzt bitte das Fenster. Nein, wirklich. Ich meine es ernst. ...Bitte?",
        'EMOTIONALE BESCHÄDIGUNG DES ERZÄHLERS: LEICHT');
    }, 1200);
  },
  idleSafe: true
};

/* --- Bomben-Szene (Hommage) --- */
S.bomb = {
  text: "Ah. Hinter der Tür: ein Countdown. Fünf Sekunden bis zur Selbstzerstörung. Ich weiß, das war nicht abgesprochen. Die Verwaltung hat etwas Eigenmächtiges installiert. Sie haben jetzt eine Wahl, und sie ist, zugegeben, ziemlich zeitkritisch.",
  enter() {
    setLevel('AKTE: 05 / DER COUNTDOWN');
    clearStage();
    const cd = document.getElementById('countdown');
    cd.style.display = 'flex';
    const num = document.getElementById('cd-num');
    let n = 5;
    num.textContent = n;
    playSound('alarm');
    this.tick = setInterval(() => {
      n--;
      num.textContent = Math.max(n, 0);
      playSound('alarm');
      if (n <= 0) {
        clearInterval(this.tick);
        cd.style.display = 'none';
        ending('bombe', 'DAS ENDE DER BOMBE',
          "Boom. Na ja. Metaphorisch. Sie sind jetzt in kleinen Stücken überall im Korridor verteilt, und wissen Sie, was das Schlimmste ist? Die Verwaltung macht Ihnen dafür keinen Ersatzkorridor. Das Ende der Bombe. Sie hatten fünf Sekunden. Es waren eigentlich sechs. Ich habe mitgezählt.",
          'ÜBERLEBENSCHANCE: NICHT GENUTZT');
      }
    }, 1000);
    document.getElementById('cd-btn').onclick = () => {
      clearInterval(this.tick);
      cd.style.display = 'none';
      decisions++; scoreDisplay.textContent = 'ENTSCHEIDUNGEN: ' + decisions;
      go(S.disarmed);
    };
  },
  leave() { clearInterval(this.tick); document.getElementById('countdown').style.display = 'none'; }
};

S.disarmed = {
  text: "Sie haben die Bombe deaktiviert. Beeindruckend. Ich muss zugeben, ich hatte Sie auf 'explosionsartiges Ende' getippt. Als Belohnung bekommen Sie die Wahrheit: Hinter der nächsten Tür liegt Ihr echtes Ende. Links oder rechts. Für immer. Oder bis zum Neustart. Das weiß ich selbst noch nicht.",
  enter() {
    setLevel('AKTE: FINAL / DIE LETZTE TÜR');
    clearStage();
    fx('invert-colors', true);
    addDoors([
      ['LINKS', () => { fx('invert-colors', false); go(S.loop); }],
      ['RECHTS', () => { fx('invert-colors', false); go(S.freedom); }],
    ]);
  },
  leave() { fx('invert-colors', false); }
};

/* --- Finale (auch ohne Bombe erreichbar über Dunkelheit → Bomben-Pfad) --- */

S.loop = {
  text: "Links. Selbstverständlich links. Wissen Sie, was hinter dieser Tür ist? Genau das, womit alles begann: zwei Türen. Willkommen in der Schleife. Ich könnte Sie jetzt rausschreiben, aber seien wir ehrlich — Sie würden sofort wieder anfangen. Wir beide wissen es. Ich sehe es in Ihren Klicks.",
  enter() {
    setLevel('AKTE: ∞ / DIE SCHLEIFE');
    clearStage();
    fx('spin-world', true);
    setTimeout(() => {
      ending('schleife', 'DAS ENDE DER SCHLEIFE',
        "Sie haben die Schleife gefunden. Das Ende, das zum Anfang wird. Der Korridor beginnt wieder ganz von vorne. Und wieder. Und wieder. Irgendwann merken Sie es gar nicht mehr. Das ist entweder die Hölle oder ein Arbeitsvertrag.",
        'SCHLEIFENZÄHLER: AKTIV');
    }, 2500);
  },
  leave() { fx('spin-world', false); }
};

S.freedom = {
  text: "Rechts. Interessant. Hinter dieser Tür ist... nichts. Kein Raum, kein Boden, kein Ende. Nur die Erkenntnis, dass Sie die ganze Zeit über ein Browserfenster mit ein paar hundert Zeilen Code gespielt haben. Und dass es Ihnen trotzdem etwas bedeutet hat. Das nenne ich Freiheit.",
  enter() {
    setLevel('AKTE: ✓ / DIE FREIHEIT');
    clearStage();
    fx('blur-vision', true);
    setTimeout(() => {
      fx('blur-vision', false);
      ending('freiheit', 'DAS WAHRE ENDE',
        "Sie haben das wahre Ende gefunden. Es gab kein Knopfsammeln, keine Trophäe, keinen Sieg. Es gab nur eine Geschichte, die Sie zu Ende gehört haben. Der Erzähler verneigt sich. Der Korridor bleibt zurück. Leuchtet weiter. Für den Nächsten.",
        foundEndings.size >= ALL_ENDINGS ? 'ALLE ENDEN GEFUNDEN. SIE SIND FERTIG. WIR SIND FERTIG.' : 'NOCH NICHT ALLE ENDEN GEFUNDEN. SIE WISSEN, WO DIE TÜREN SIND.');
    }, 2200);
  },
  leave() { fx('blur-vision', false); }
};

/* ---------- Übergang ---------- */
function go(scene) {
  if (currentScene && currentScene.leave) currentScene.leave();
  currentScene = scene;
  const text = scene.text.replace('%N%', runs === 0 ? 'ersten' : (runs + 1) + '.');
  speak(text, () => scene.enter());
}

/* ---------- Start ---------- */
function start() {
  decisions = 0;
  scoreDisplay.textContent = 'ENTSCHEIDUNGEN: 0';
  setLevel('AKTE: 01 / GEHORSAM');
  go(S.intro);
}
start();
</script>
